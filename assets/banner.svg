<svg width="100%" height="100%" viewBox="0 0 920 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0617"/>
      <stop offset="50%" stop-color="#120924"/>
      <stop offset="100%" stop-color="#07030e"/>
    </linearGradient>

    <radialGradient id="portal-glow" cx="72%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#f43f5e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Serpent Gradient -->
    <linearGradient id="snake-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f0abfc"/>
      <stop offset="60%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="snake-stroke" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae8ff"/>
      <stop offset="40%" stop-color="#e879f9"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.025); }
      }
      @keyframes float-serpent {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(0.8deg); }
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.85; }
      }
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.3); opacity: 0.5; }
      }
      .glow-ring { transform-origin: 675px 180px; animation: pulse-ring 6s ease-in-out infinite; }
      .floating-snake { transform-origin: 675px 180px; animation: float-serpent 7s ease-in-out infinite; }
      .star-shimmer { animation: shimmer 4s ease-in-out infinite; }
      .online-dot { transform-origin: 92px 308px; animation: pulse-dot 2s ease-in-out infinite; }
      .fira-mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="920" height="360" rx="16" stroke="url(#snake-stroke)" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Radial Cosmic Glow behind Snake -->
  <rect x="350" y="0" width="570" height="360" rx="16" fill="url(#portal-glow)"/>

  <!-- Subtle Grid Lines (Cyber Aesthetic) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="0.8">
    <line x1="40" y1="0" x2="40" y2="360" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="0" y1="70" x2="920" y2="70" />
    <line x1="0" y1="150" x2="920" y2="150" />
    <line x1="0" y1="230" x2="920" y2="230" />
    <line x1="0" y1="310" x2="920" y2="310" />
  </g>

  <!-- Constellation Stars -->
  <g class="star-shimmer" fill="#e9d5ff">
    <circle cx="95" cy="45" r="1.2" opacity="0.6"/>
    <circle cx="210" cy="85" r="1.5" opacity="0.8"/>
    <circle cx="340" cy="38" r="1" opacity="0.5"/>
    <circle cx="460" cy="110" r="1.8" opacity="0.9"/>
    <circle cx="530" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="830" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="870" cy="190" r="1.2" opacity="0.6"/>
    <circle cx="810" cy="310" r="1.7" opacity="0.8"/>
    <circle cx="510" cy="330" r="1.2" opacity="0.5"/>
    <circle cx="390" cy="290" r="1" opacity="0.6"/>
    <path d="M460 106 V114 M456 110 H464" stroke="#f472b6" stroke-width="0.8" opacity="0.7"/>
    <path d="M830 56 V64 M826 60 H834" stroke="#c084fc" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- Left Side: Content & Identity -->
  <g transform="translate(60, 0)">
    <!-- Top Micro Tag -->
    <g transform="translate(0, 52)">
      <rect width="195" height="24" rx="12" fill="url(#pill-grad)" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4"/>
      <text x="14" y="16" fill="#c084fc" class="fira-mono" font-size="10.5" font-weight="600" letter-spacing="2">| SOFTWARE ENGINEER |</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="125" fill="url(#text-grad)" class="sans-title" font-size="38" font-weight="800" letter-spacing="-0.5">
      NGUYỄN VĂN MINH
    </text>

    <!-- Subtitle / Tagline inspired by LIVA -->
    <text x="0" y="162" fill="#e2e8f0" class="sans-title" font-size="17" font-weight="300" letter-spacing="0.2">
      I build digital systems that feel like <tspan fill="#f472b6" font-style="italic" font-weight="600">the future.</tspan>
    </text>

    <text x="0" y="192" fill="#94a3b8" class="sans-title" font-size="13.5" font-weight="400">
      Crafting intuitive experiences, robust backends &amp; clean architectures.
    </text>

    <!-- Interactive / Highlight Badges -->
    <g transform="translate(0, 222)">
      <g transform="translate(0, 0)">
        <rect width="118" height="30" rx="15" fill="#1e1338" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
        <circle cx="16" cy="15" r="4" fill="#a855f7" />
        <text x="28" y="19" fill="#e9d5ff" class="sans-title" font-size="11.5" font-weight="600">Java • C# • JS</text>
      </g>

      <g transform="translate(128, 0)">
        <rect width="148" height="30" rx="15" fill="#1e1338" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="16" cy="15" r="4" fill="#ec4899" />
        <text x="28" y="19" fill="#fce7f3" class="sans-title" font-size="11.5" font-weight="600">Clean Architecture</text>
      </g>

      <g transform="translate(286, 0)">
        <rect width="138" height="30" rx="15" fill="#1e1338" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
        <circle cx="16" cy="15" r="4" fill="#38bdf8" />
        <text x="28" y="19" fill="#e0f2fe" class="sans-title" font-size="11.5" font-weight="600">@Minh1210 Profile</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(0, 290)">
      <rect width="365" height="34" rx="8" fill="#150d2a" fill-opacity="0.75" stroke="#7e22ce" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4.5" fill="#10b981" class="online-dot"/>
      <circle cx="20" cy="17" r="8" fill="#10b981" opacity="0.25"/>
      <text x="35" y="21" fill="#cbd5e1" class="fira-mono" font-size="11" font-weight="500">
        AVAILABLE FOR COLLABORATION &amp; PROJECTS
      </text>
    </g>
  </g>

  <!-- Right Side: The Mystic Cosmic Serpent Portal -->
  <g transform="translate(685, 180)">
    <!-- Celestial Portal Rings -->
    <circle cx="0" cy="0" r="115" stroke="url(#snake-stroke)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4" class="glow-ring"/>
    <circle cx="0" cy="0" r="100" stroke="url(#snake-stroke)" stroke-width="2.5" stroke-opacity="0.7" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="82" fill="#120826" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Orbital Energy Rings -->
    <ellipse cx="0" cy="0" rx="128" ry="48" stroke="#e879f9" stroke-width="1.2" stroke-opacity="0.45" transform="rotate(-28)" filter="url(#soft-glow)"/>
    <ellipse cx="0" cy="0" rx="138" ry="32" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3" transform="rotate(35)"/>

    <!-- The Mystic Serpent Artwork -->
    <g class="floating-snake">
      <!-- Shadow Glow -->
      <path d="M 35 -75 
               C 70 -55, 82 -10, 68 35 
               C 55 78, 5 95, -35 80 
               C -75 65, -88 20, -75 -25 
               C -60 -70, -15 -85, 20 -70 
               C 45 -58, 50 -25, 35 0 
               C 22 20, -5 28, -25 12 
               C -42 -2, -35 -28, -12 -38
               C 10 -45, 28 -28, 22 -5
               C 18 12, 0 16, -10 6" 
            fill="none" 
            stroke="#a855f7" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-opacity="0.2" 
            filter="url(#neon-glow)"/>

      <!-- Main Body -->
      <path d="M 35 -75 
               C 70 -55, 82 -10, 68 35 
               C 55 78, 5 95, -35 80 
               C -75 65, -88 20, -75 -25 
               C -60 -70, -15 -85, 20 -70 
               C 45 -58, 50 -25, 35 0 
               C 22 20, -5 28, -25 12 
               C -42 -2, -35 -28, -12 -38
               C 10 -45, 28 -28, 22 -5
               C 18 12, 0 16, -10 6" 
            fill="none" 
            stroke="url(#snake-grad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            filter="url(#soft-glow)"/>

      <!-- High-Luminosity Spine -->
      <path d="M 35 -75 
               C 70 -55, 82 -10, 68 35 
               C 55 78, 5 95, -35 80 
               C -75 65, -88 20, -75 -25 
               C -60 -70, -15 -85, 20 -70 
               C 45 -58, 50 -25, 35 0 
               C 22 20, -5 28, -25 12 
               C -42 -2, -35 -28, -12 -38
               C 10 -45, 28 -28, 22 -5
               C 18 12, 0 16, -10 6" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-opacity="0.9"/>

      <!-- Serpent Head -->
      <g transform="translate(35, -75)">
        <path d="M -5 -3 Q -15 -18 -28 -22" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 5 -6 Q 12 -22 25 -30" fill="none" stroke="#e879f9" stroke-width="2" stroke-linecap="round"/>
        
        <path d="M -8 -8 C -4 -16, 12 -16, 16 -8 C 20 0, 10 10, 0 10 C -8 10, -12 0, -8 -8 Z" fill="#ffffff" filter="url(#soft-glow)"/>
        
        <circle cx="2" cy="-4" r="2.8" fill="#f43f5e" filter="url(#soft-glow)"/>
        <circle cx="2" cy="-4" r="1.2" fill="#ffffff"/>

        <path d="M 8 2 Q 22 8 32 2" fill="none" stroke="#f0abfc" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 6 6 Q 16 18 24 24" fill="none" stroke="#c084fc" stroke-width="1.4" stroke-linecap="round"/>
      </g>

      <!-- Serpent Tail -->
      <g transform="translate(-10, 6)">
        <path d="M 0 0 Q -12 12 -6 22 Q 0 16 6 8 Z" fill="url(#snake-stroke)" opacity="0.8"/>
      </g>

      <!-- Scales Dots -->
      <circle cx="70" cy="-30" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="60" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="-15" cy="85" r="1.8" fill="#ffffff" opacity="0.9"/>
      <circle cx="-75" cy="40" r="1.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="-50" cy="-60" r="1.8" fill="#ffffff" opacity="0.9"/>
      <circle cx="2" cy="-73" r="1.5" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Floating Orbs -->
    <circle cx="78" cy="-55" r="4.5" fill="#ec4899" filter="url(#soft-glow)"/>
    <circle cx="-85" cy="65" r="3.5" fill="#818cf8" filter="url(#soft-glow)"/>
    <circle cx="-60" cy="-70" r="2.5" fill="#c084fc"/>
  </g>
</svg>
