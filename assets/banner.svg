<svg width="940" height="380" viewBox="0 0 940 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07030c"/>
      <stop offset="35%" stop-color="#0f0618"/>
      <stop offset="70%" stop-color="#18071e"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>

    <!-- Serpent Skin: Deep Obsidian Black with Velvet Violet Undertones -->
    <linearGradient id="serpent-scales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d153e"/>
      <stop offset="25%" stop-color="#160822"/>
      <stop offset="65%" stop-color="#0d0414"/>
      <stop offset="100%" stop-color="#260817"/>
    </linearGradient>

    <!-- Cyber Spine Neon Pulse -->
    <linearGradient id="serpent-spine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="35%" stop-color="#ec4899"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Crimson & Gold Accents for Slogans -->
    <linearGradient id="crimson-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fecdd3"/>
      <stop offset="80%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="gold-viet-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <radialGradient id="viper-aura" cx="72%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#3b0764" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#07030c" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes serpent-slither {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1deg); }
      }
      @keyframes spine-current {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes tongue-strike {
        0%, 75%, 100% { transform: scale(1); opacity: 0.9; }
        80% { transform: scale(1.3) translateX(3px); opacity: 1; }
        85% { transform: scale(0.9); opacity: 0.7; }
      }
      @keyframes eye-glint {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #f43f5e); }
        50% { opacity: 1; filter: drop-shadow(0 0 7px #ef4444); }
      }
      .snake-body-anim { transform-origin: 710px 185px; animation: serpent-slither 5.5s ease-in-out infinite; }
      .spine-pulse { stroke-dasharray: 60 260; animation: spine-current 3.5s linear infinite; }
      .tongue-motion { transform-origin: 640px 75px; animation: tongue-strike 2.8s ease-in-out infinite; }
      .ruby-eye { animation: eye-glint 2s ease-in-out infinite; }
      .mono-code { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .display-sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="940" height="380" rx="16" fill="url(#bg-canvas)"/>
  <rect width="940" height="380" rx="16" stroke="#9333ea" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Cyber Hex Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="50" x2="940" y2="50"/>
    <line x1="0" y1="130" x2="940" y2="130"/>
    <line x1="0" y1="210" x2="940" y2="210"/>
    <line x1="0" y1="290" x2="940" y2="290"/>
    <line x1="80" y1="0" x2="80" y2="380"/>
    <line x1="220" y1="0" x2="220" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="500" y1="0" x2="500" y2="380"/>
  </g>

  <!-- Aura Glow on Right Side -->
  <rect x="420" y="0" width="520" height="380" rx="16" fill="url(#viper-aura)"/>

  <!-- LEFT SIDE: IDENTITY & PHILOSOPHY -->
  <g transform="translate(56, 0)">
    <!-- Top Micro Tag -->
    <g transform="translate(0, 42)">
      <rect width="250" height="24" rx="12" fill="#1d0928" stroke="#f43f5e" stroke-width="0.9" stroke-opacity="0.6"/>
      <circle cx="12" cy="12" r="3" fill="#f43f5e"/>
      <text x="24" y="16" fill="#fecdd3" class="mono-code" font-size="10" font-weight="700" letter-spacing="1.5">CYBERSECURITY • PENTEST</text>
    </g>

    <!-- Handle Name: secretzot -->
    <text x="0" y="112" fill="url(#crimson-glow)" class="display-sans" font-size="44" font-weight="900" letter-spacing="-1">
      secretzot
    </text>

    <!-- CORE USER QUOTES -->
    <g transform="translate(0, 142)">
      <!-- Quote 1: "No Money No Happy" -->
      <g transform="translate(0, 0)">
        <text x="0" y="18" fill="#ffffff" class="display-sans" font-size="21" font-weight="800" letter-spacing="0.2">
          "No Money No Happy"
        </text>
      </g>

      <!-- Quote 2: "Biết đủ sẽ hạnh phúc" -->
      <g transform="translate(0, 36)">
        <text x="0" y="18" fill="url(#gold-viet-text)" class="display-sans" font-size="19" font-weight="700" font-style="italic">
          ☯ "Biết đủ sẽ hạnh phúc"
        </text>
      </g>
    </g>

    <!-- Disciplines: PWN • REV • WEB -->
    <g transform="translate(0, 226)">
      <rect width="90" height="28" rx="6" fill="#220a16" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="16" y="18" fill="#fecdd3" class="mono-code" font-size="11.5" font-weight="700">⚡ PWN</text>

      <rect x="102" y="0" width="90" height="28" rx="6" fill="#1c0a2e" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="120" y="18" fill="#f3e8ff" class="mono-code" font-size="11.5" font-weight="700">🔍 REV</text>

      <rect x="204" y="0" width="90" height="28" rx="6" fill="#081728" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
      <text x="220" y="18" fill="#e0f2fe" class="mono-code" font-size="11.5" font-weight="700">🌐 WEB</text>
    </g>

    <!-- Sub-info details -->
    <text x="0" y="286" fill="#94a3b8" class="mono-code" font-size="11.5">
      Binary Exploits &amp; ROP • Ghidra &amp; IDA • Web Pentesting
    </text>

    <!-- Status Line -->
    <g transform="translate(0, 310)">
      <rect width="360" height="30" rx="8" fill="#120621" stroke="#7e22ce" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <circle cx="16" cy="15" r="7" fill="#10b981" opacity="0.3"/>
      <text x="30" y="19" fill="#cbd5e1" class="mono-code" font-size="10.5" font-weight="600">
        STATUS: ROOT ACCESS • 0-DAY HUNTING
      </text>
    </g>
  </g>

  <!-- RIGHT SIDE: THE REALISTIC BLACK VIPER SERPENT (Inspired by reference images) -->
  <g class="snake-body-anim">
    <!-- Crescent Moon Horn behind the Serpent Head (Inspired by Image 3) -->
    <path d="M 660 55 C 690 40, 735 50, 745 90 C 720 70, 680 70, 660 55 Z" fill="#ffffff" filter="url(#neon-glow)" opacity="0.85"/>
    <path d="M 660 55 C 635 40, 590 50, 580 90 C 605 70, 645 70, 660 55 Z" fill="#ffffff" filter="url(#neon-glow)" opacity="0.85"/>

    <!-- Norse Runes / Cyber Glyphs around Serpent -->
    <g class="mono-code" font-size="12" font-weight="700" fill="#f43f5e" opacity="0.85" filter="url(#subtle-shadow)">
      <text x="590" y="165">ᛉ 0xCC</text>
      <text x="815" y="130">ᚦ ROP</text>
      <text x="800" y="270">ᚾ GDB</text>
      <text x="560" y="295">PWN::1337</text>
    </g>

    <!-- Outer Deep Shadow Glow of Snake Curve -->
    <path d="M 645 90
             C 675 120, 765 130, 785 180
             C 805 230, 755 270, 695 275
             C 635 280, 595 230, 610 185
             C 625 140, 695 145, 735 190
             C 770 230, 755 300, 695 330
             C 645 355, 605 330, 595 300"
          fill="none" 
          stroke="#f43f5e" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-opacity="0.18" 
          filter="url(#neon-glow)"/>

    <!-- Main Thick Muscular Viper Body -->
    <path d="M 645 90
             C 675 120, 765 130, 785 180
             C 805 230, 755 270, 695 275
             C 635 280, 595 230, 610 185
             C 625 140, 695 145, 735 190
             C 770 230, 755 300, 695 330
             C 645 355, 605 330, 595 300"
          fill="none" 
          stroke="url(#serpent-scales)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Crosshatch Scales (Realistic serpent texture segments) -->
    <path d="M 645 90
             C 675 120, 765 130, 785 180
             C 805 230, 755 270, 695 275
             C 635 280, 595 230, 610 185
             C 625 140, 695 145, 735 190
             C 770 230, 755 300, 695 330
             C 645 355, 605 330, 595 300"
          fill="none" 
          stroke="#3d1450" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-dasharray="3 6"/>

    <!-- Electric Luminescent Cyber-Spine -->
    <path d="M 645 90
             C 675 120, 765 130, 785 180
             C 805 230, 755 270, 695 275
             C 635 280, 595 230, 610 185
             C 625 140, 695 145, 735 190
             C 770 230, 755 300, 695 330
             C 645 355, 605 330, 595 300"
          fill="none" 
          stroke="url(#serpent-spine)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          class="spine-pulse"
          filter="url(#subtle-shadow)"/>

    <!-- Surreal Floating Halo Rings piercing Snake body (Inspired by Image 3) -->
    <ellipse cx="775" cy="190" rx="16" ry="7" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.8" transform="rotate(-30 775 190)" filter="url(#subtle-shadow)"/>
    <ellipse cx="625" cy="210" rx="15" ry="6" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.8" transform="rotate(45 625 210)" filter="url(#subtle-shadow)"/>
    <ellipse cx="675" cy="325" rx="14" ry="6" stroke="#f43f5e" stroke-width="1.6" fill="none" opacity="0.8" transform="rotate(-15 675 325)"/>

    <!-- REALISTIC VIPER HEAD (Facing downward-left ready to strike) -->
    <g transform="translate(645, 90) rotate(-135)">
      <!-- Broad triangular viper jaw outline -->
      <path d="M 0 -20 
               C 18 -18, 28 -7, 26 12 
               C 24 24, 11 30, 0 35 
               C -11 30, -24 24, -26 12 
               C -28 -7, -18 -18, 0 -20 Z" 
            fill="#12061e" 
            stroke="#f43f5e" 
            stroke-width="2"/>

      <!-- Inner head crown armor plates -->
      <path d="M 0 -11 C 9 -9, 15 0, 13 13 C 7 19, 0 22, 0 22 C 0 22, -7 19, -13 13 C -15 0, -9 -9, 0 -11 Z" fill="#2a1040"/>

      <!-- Menacing Ruby Red Eyes with Slit Pupils -->
      <ellipse cx="12" cy="6" rx="4" ry="2.2" fill="#ef4444" class="ruby-eye" transform="rotate(25 12 6)"/>
      <ellipse cx="-12" cy="6" rx="4" ry="2.2" fill="#ef4444" class="ruby-eye" transform="rotate(-25 -12 6)"/>
      <line x1="12" y1="4" x2="12" y2="8" stroke="#ffffff" stroke-width="1.2"/>
      <line x1="-12" y1="4" x2="-12" y2="8" stroke="#ffffff" stroke-width="1.2"/>

      <!-- Razor Venom Fangs -->
      <path d="M 6 30 L 8 38 L 4 33 Z" fill="#ffffff" filter="url(#subtle-shadow)"/>
      <path d="M -6 30 L -8 38 L -4 33 Z" fill="#ffffff" filter="url(#subtle-shadow)"/>

      <!-- Flicking Forked Tongue -->
      <g class="tongue-motion">
        <path d="M 0 33 L 0 46 L 6 53 M 0 46 L -6 53" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Serpent Slender Tail -->
    <g transform="translate(595, 300)">
      <path d="M 0 0 C -12 -15, -20 -35, -15 -50" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-15" cy="-50" r="2.5" fill="#f43f5e" filter="url(#subtle-shadow)"/>
    </g>
  </g>
</svg>
