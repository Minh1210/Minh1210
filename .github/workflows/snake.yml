name: Generate Snake Contribution Animation

on:
  schedule:
    # Chạy định kỳ mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-contribution-grid-snake
        uses: Platane/snk@v3
        with:
          github_user_name: Minh1210
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f43f5e&color_dots=#161b22,#3b1d60,#6b21a8,#a855f7,#f43f5e
            dist/github-contribution-grid-snake.gif?color_snake=#f43f5e&color_dots=#161b22,#3b1d60,#6b21a8,#a855f7,#f43f5e

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
